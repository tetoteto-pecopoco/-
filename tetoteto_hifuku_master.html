const K="tetoteto-hifuku-v1",L="アイウエ";let S={ok:{},mis:[]},G=null;const R=document.getElementById("r");

const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const br=()=>`<div class="brand"><div class="logo">て</div>おうち学習室 てとてと</div>`;
function home(){G=null;
R.innerHTML=br()+`<section class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.08em;color:#e8d6f3">${Q.length} QUESTIONS · ${U.length} UNITS</div><h1>家庭科 被服マスター</h1><p>教科書の単元ごとに挑戦できる4択ゲーム。被服の役割から洗濯、ミシン、パンツの縫製まで。</p></section><div class="stats"><div class="stat"><b>${Q.length}</b><span>収録問題</span></div><div class="stat"><b>${Object.keys(S.ok).length}</b><span>正解したことがある</span></div><div class="stat"><b>${S.mis.length}</b><span>要復習</span></div></div><h2>まずはここから</h2><div class="modes"><button class="tile" onclick="go('q')"><span>10問</span><strong>ランダム10問</strong><small>短時間の復習に</small></button><button class="tile" ${S.mis.length?"":"disabled"} onclick="go('rv')"><span>復習</span><strong>間違え直し</strong><small>${S.mis.length}問</small></button></div><div class="modes" style="margin-top:11px"><button class="tile wide" onclick="go('im')"><span>図版 30問</span><strong>図を見て答える</strong><small>記号・織り組織・採寸・型紙の確認</small></button></div><h2>難易度で選ぶ</h2><div class="modes">${["基本","標準","応用"].map(l=>`<button class="tile" onclick="go('d${l}')"><span>${Q.filter(q=>q.df===l).length}問</span><strong>${l}</strong><small>難易度別チャレンジ</small></button>`).join("")}<button class="tile" onclick="go('all')"><span>全${Q.length}問</span><strong>全問ランダム</strong><small>すべてシャッフル</small></button></div><h2>単元で選ぶ</h2><div class="modes">${U.map(u=>{const a=Q.filter(q=>q.u===u[0]),n=a.filter(q=>S.ok[q.id]).length;return`<button class="tile" onclick="go('u${u[0]}')"><span>${n}/${a.length} 達成</span><strong>${+u[0]}. ${E(u[1])}</strong><small>教科書 p.${u[2]}</small></button>`}).join("")}</div><p class="note">添付資料p.3〜46を参考に問題を追加しました。図は学習用に描き直した模式図です。画像問題は「図を見て答える」からも練習できます。</p>`;scrollTo(0,0)}
function go(m){let a=m==="im"?Q.filter(q=>q.fig):m==="all"?Q:m==="q"?sh(Q).slice(0,10):m==="rv"?Q.filter(q=>S.mis.includes(q.id)):m[0]==="u"?Q.filter(q=>q.u===m.slice(1)):Q.filter(q=>q.df===m.slice(1));a=sh(a);if(!a.length)return home();G={m,a,i:0,ans:{},ord:{},t:m==="im"?"図を見て答える":m==="all"?"全問":m==="q"?"ランダム10問":m==="rv"?"間違え直し":m[0]==="u"?UT[m.slice(1)][1]:m.slice(1)};show()}
function show(){const q=G.a[G.i],o=G.ord[q.id]||(G.ord[q.id]=sh(q.o)),an=G.ans[q.id],dn=an!==undefined,ok=dn&&an===q.a;
R.innerHTML=br()+`<div class="top"><button class="back" onclick="home()">‹ ホーム</button><span class="pill">${E(G.t)} ${G.i+1}/${G.a.length}</span></div><div class="track"><div class="bar" style="width:${100*(G.i+(dn?1:0))/G.a.length}%"></div></div><article class="card"><div class="qh"><span>${E(UT[q.u][1])}</span><span>${q.df} · p.${q.p}</span></div><div class="q">${E(q.q)}</div>${q.fig?`<figure class="qfig"><img src="${q.fig.src}" alt="問題の図" /><figcaption>図は学習用の模式図です。</figcaption></figure>`:""}<div class="opts">${o.map((t,i)=>`<button class="opt ${dn?(t===q.a?"c":t===an?"x":"d"):""}" ${dn?"disabled":""} onclick="pick(${i})"><span class="l">${L[i]}</span><span>${E(t)}</span></button>`).join("")}</div>${dn?`<div class="fb ${ok?"":"bad"}"><strong>${ok?"✓ 正解！":"✕ もう一度覚えよう"}</strong>正解：<b>${E(q.a)}</b><br><span>${E(q.e)}</span></div><button class="btn" onclick="nx()">${G.i+1===G.a.length?"結果を見る":"次の問題へ →"}</button>`:""}</article>`;scrollTo(0,0)}
function pick(i){const q=G.a[G.i];if(G.ans[q.id]!==undefined)return;const t=G.ord[q.id][i];G.ans[q.id]=t;if(t===q.a){S.ok[q.id]=1;S.mis=S.mis.filter(x=>x!==q.id)}else if(!S.mis.includes(q.id))S.mis.push(q.id);sv();show()}
function nx(){G.i++;G.i>=G.a.length?fin():show()}
function fin(){const h=G.a.filter(q=>G.ans[q.id]===q.a).length,t=G.a.length,p=Math.round(h/t*100),m=G.a.filter(q=>G.ans[q.id]!==q.a);
R.innerHTML=br()+`<section class="res"><span class="pill">${E(G.t)} · 結果</span><div class="pct">${p}<small style="font-size:22px">%</small></div><h2>${p===100?"全問正解！":p>=80?"よくできました！":p>=60?"あと少し！":"もう一度チャレンジ！"}</h2><b>${h} / ${t} 問正解</b>${m.length?`<div class="wl"><b>今回まちがえた問題</b>${m.map(q=>`<div>${E(q.q)}<span>正解：${E(q.a)}</span></div>`).join("")}</div>`:""}<button class="btn" onclick="go(G.m)">もう一度解く</button>${S.mis.length?`<button class="sub" onclick="go('rv')">間違え直し（${S.mis.length}問）</button>`:""}<button class="sub" onclick="home()">ホームに戻る</button></section>`;scrollTo(0,0)}
home();
</script></body></html>
